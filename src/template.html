<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>__TITLE__ · Echo</title>
<style>
  :root {
    --bg: #f7f5f1;
    --card: #ffffff;
    --ink: #1c1b18;
    --muted: #8a857a;
    --accent: #c0392b;
    --accent-soft: #fbeae7;
    --line: #e8e4dc;
    --serif: Georgia, "Times New Roman", "Songti SC", serif;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    line-height: 1.6;
  }

  /* ---- 顶部控制条 ---- */
  header {
    position: sticky; top: 0; z-index: 10;
    background: rgba(247, 245, 241, .86);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--line);
    padding: 12px 20px;
  }
  .bar {
    max-width: 1060px; margin: 0 auto;
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  }
  .title {
    font-family: var(--serif); font-size: 17px; font-weight: 700;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 260px;
  }
  .controls { display: flex; align-items: center; gap: 8px; }
  button {
    font-family: inherit; cursor: pointer; border: 1px solid var(--line);
    background: var(--card); color: var(--ink); border-radius: 10px;
    padding: 7px 12px; font-size: 14px; transition: .15s;
  }
  button:hover { border-color: var(--accent); color: var(--accent); }
  button.primary {
    background: var(--accent); color: #fff; border-color: var(--accent);
    min-width: 52px; font-size: 16px;
  }
  button.primary:hover { filter: brightness(1.08); color: #fff; }
  button.toggle-on { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }
  select {
    font-family: inherit; font-size: 14px; padding: 6px 8px;
    border: 1px solid var(--line); border-radius: 10px; background: var(--card); color: var(--ink);
  }
  .meta { color: var(--muted); font-size: 13px; }
  .progress-track {
    flex-basis: 100%; height: 5px; background: var(--line); border-radius: 3px; overflow: hidden;
  }
  .progress-fill { height: 100%; width: 0%; background: var(--accent); transition: width .2s linear; }

  /* ---- 主体布局 ---- */
  .layout {
    max-width: 1060px; margin: 20px auto 60px; padding: 0 20px;
    display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 20px; align-items: start;
  }
  @media (max-width: 820px) { .layout { grid-template-columns: 1fr; } }

  /* ---- 焦点句卡片 ---- */
  .focus {
    background: var(--card); border: 1px solid var(--line); border-radius: 16px;
    padding: 20px 24px; box-shadow: 0 2px 10px rgba(28, 27, 24, .04);
  }
  .focus-label { color: var(--accent); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; margin-bottom: 8px; }
  .focus-text { font-family: var(--serif); font-size: 22px; line-height: 1.7; }
  .focus-meta { margin-top: 10px; color: var(--muted); font-size: 13px; }

  /* ---- 全文句子列表 ---- */
  .panel { background: var(--card); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
  .panel-head { padding: 12px 18px; font-size: 13px; color: var(--muted); border-bottom: 1px solid var(--line); }
  .sents { max-height: 70vh; overflow-y: auto; }
  .sent {
    display: flex; gap: 12px; padding: 11px 16px; cursor: pointer;
    border-bottom: 1px solid var(--line); transition: background .15s;
  }
  .sent:last-child { border-bottom: none; }
  .sent:hover { background: #fbfaf7; }
  .sent .idx { color: var(--muted); font-size: 12px; min-width: 26px; text-align: right; padding-top: 3px; font-variant-numeric: tabular-nums; }
  .sent .txt { font-family: var(--serif); font-size: 15.5px; }
  .sent.active { background: var(--accent-soft); }
  .sent.active .idx { color: var(--accent); font-weight: 700; }
  .sent.notready .txt { opacity: .38; }
  .sent.notready .idx { color: #d9d2c5; }

  /* ---- 生词高亮 ---- */
  .vw { color: var(--accent); font-weight: 600; border-bottom: 1px dotted rgba(192, 57, 43, .5); cursor: help; }

  /* ---- 词汇侧栏 ---- */
  aside { position: sticky; top: 86px; display: flex; flex-direction: column; gap: 20px; }
  .vocab-head { display: flex; align-items: center; justify-content: space-between; padding: 12px 18px; border-bottom: 1px solid var(--line); }
  .vocab-head h3 { margin: 0; font-size: 14px; }
  .vocab-list { max-height: 62vh; overflow-y: auto; }
  .vocab-item { padding: 10px 18px; border-bottom: 1px solid var(--line); cursor: pointer; transition: background .15s; }
  .vocab-item:hover { background: #fbfaf7; }
  .vocab-item:last-child { border-bottom: none; }
  .vw-line { display: flex; align-items: baseline; gap: 8px; }
  .vw-word { font-family: var(--serif); font-size: 17px; font-weight: 700; color: var(--ink); }
  .vw-ipa { color: var(--muted); font-size: 13px; }
  .vw-mean { color: var(--ink); font-size: 13.5px; margin-top: 2px; }
  .vw-ex { color: var(--muted); font-size: 12.5px; font-style: italic; margin-top: 2px; }
  .speaker { color: var(--accent); font-size: 13px; margin-left: auto; }

  .hint { color: var(--muted); font-size: 12px; }
  kbd {
    background: var(--card); border: 1px solid var(--line); border-bottom-width: 2px;
    border-radius: 5px; padding: 1px 6px; font-size: 11px; font-family: var(--sans);
  }

  /* ---- 逐词可点击 ---- */
  .w { cursor: pointer; border-radius: 4px; padding: 0 1px; transition: background .12s; }
  .w:hover { background: #f3e6c8; }
  .w.active-lookup { background: #ffe08a; }
  .vw.w { cursor: pointer; }

  /* ---- 查词卡片 ---- */
  .hidden { display: none !important; }
  .lookup {
    position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
    width: min(420px, calc(100vw - 24px)); max-height: 48vh; overflow: auto;
    background: #fffdf8; border: 1px solid var(--line); border-radius: 14px;
    box-shadow: 0 10px 30px rgba(28, 27, 24, .16); z-index: 50; padding: 12px 16px;
    font-family: var(--sans);
  }
  .lookup-head { display: flex; align-items: baseline; gap: 10px; }
  .lookup-word { font-family: var(--serif); font-size: 21px; font-weight: 700; }
  .lookup-ipa { color: var(--muted); font-size: 13px; }
  .lookup-btn { border: none; background: none; cursor: pointer; font-size: 15px; color: var(--accent); padding: 2px 6px; }
  .lookup-zh { margin-top: 6px; font-size: 15px; color: #0b6e4f; font-weight: 500; }
  .lookup-pos { font-style: italic; color: var(--accent); font-size: 13px; margin: 8px 0 2px; }
  .lookup-def { font-size: 14px; margin-top: 2px; }
  .lookup-ex { color: var(--muted); font-size: 13px; font-style: italic; margin-top: 2px; }
  .lookup-loading { color: var(--muted); font-size: 14px; }

  /* ---- 生词本 ---- */
  #vn-count { font-size: 12px; }
  #lookup-save { font-size: 13px; }
  .lookup-btn.toggle-on { background: var(--accent-soft); border-radius: 8px; color: var(--accent); }
  .vn-modal {
    position: fixed; inset: 0; background: rgba(28,27,24,.35); z-index: 60;
    display: flex; align-items: center; justify-content: center;
  }
  .vn-panel {
    width: min(560px, calc(100vw - 32px)); max-height: 76vh; display: flex; flex-direction: column;
    background: var(--card); border: 1px solid var(--line); border-radius: 16px;
    box-shadow: 0 16px 48px rgba(28,27,24,.28); overflow: hidden;
  }
  .vn-head { display: flex; align-items: center; gap: 8px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
  .vn-head h3 { margin: 0; font-size: 15px; flex: 1; }
  .vn-head button { font-size: 13px; padding: 5px 10px; }
  .vn-list { overflow-y: auto; padding: 4px 0; }
  .vn-item { padding: 10px 16px; border-bottom: 1px solid var(--line); }
  .vn-item:last-child { border-bottom: none; }
  .vn-line { display: flex; align-items: baseline; gap: 8px; }
  .vn-word { font-family: var(--serif); font-size: 17px; font-weight: 700; }
  .vn-zh { color: #0b6e4f; font-size: 13.5px; }
  .vn-btn { border: none; background: none; cursor: pointer; font-size: 14px; padding: 2px 4px; color: var(--muted); }
  .vn-btn:hover { color: var(--accent); }
  .vn-btn[data-act="del"] { margin-left: auto; }
  .vn-en { font-size: 13px; margin-top: 3px; }
  .vn-note { font-size: 12.5px; color: var(--muted); font-style: italic; margin-top: 3px; }
  .vn-empty { padding: 28px 16px; text-align: center; color: var(--muted); font-size: 14px; }

  /* ---- 设置页 ---- */
  .set-section { padding: 4px 0 14px; border-bottom: 1px solid var(--line); }
  .set-section:last-child { border-bottom: none; padding-bottom: 4px; }
  .set-title { font-size: 13px; font-weight: 600; color: var(--accent); margin-bottom: 8px; }
  .set-title .hint { font-weight: 400; }
  .set-list { display: flex; flex-direction: column; gap: 6px; }
  .set-item, .set-row { display: flex; align-items: center; gap: 8px; font-size: 13px; }
  .set-row { margin-bottom: 7px; }
  .set-label { color: var(--muted); min-width: 78px; flex-shrink: 0; }
  .set-badge { background: var(--accent-soft); color: var(--accent); border-radius: 6px; padding: 1px 6px; font-size: 11px; flex-shrink: 0; }
  .set-path { flex: 1; font-family: ui-monospace, Menlo, monospace; font-size: 12px;
              overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .set-empty { color: var(--muted); font-size: 13px; }
  .set-add { display: flex; gap: 8px; margin-top: 10px; align-items: center; flex-wrap: wrap; }
  .set-add input { flex: 1; min-width: 240px; font-family: ui-monospace, Menlo, monospace; font-size: 12px;
                   padding: 6px 10px; border: 1px solid var(--line); border-radius: 8px;
                   background: var(--card); color: var(--ink); }
  .set-add button { font-size: 13px; padding: 6px 12px; }
  .set-note { color: var(--muted); font-size: 12px; margin-top: 8px; line-height: 1.6; }
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="title">🎧 Echo · __TITLE__</div>
    <div class="controls">
      <button id="prev" title="上一句 (←)">⏮</button>
      <button id="play" class="primary" title="播放/暂停 (空格)">▶</button>
      <button id="next" title="下一句 (→)">⏭</button>
      <select id="speed" title="语速">
        <option value="0.5">0.5×</option>
        <option value="0.75">0.75×</option>
        <option value="0.9">0.9×</option>
        <option value="1.0" selected>1.0×</option>
        <option value="1.25">1.25×</option>
        <option value="1.5">1.5×</option>
        <option value="2.0">2.0×</option>
      </select>
      <button id="repeat" title="单句循环">🔁 单句</button>
      <button id="auto" class="toggle-on" title="自动连播">连播</button>
      <select id="loop" title="循环模式">
        <option value="off">不循环</option>
        <option value="track" selected>单篇循环</option>
      </select>
      <button id="vn-open" title="生词本">📒<span id="vn-count"></span></button>
      <button id="set-open" title="设置">⚙️</button>
    </div>
    <div class="meta" id="counter">0 / 0</div>
    <div class="meta" id="ready"></div>
    <div class="progress-track"><div class="progress-fill" id="progress"></div></div>
  </div>
</header>

<div class="layout">
  <main>
    <div class="focus">
      <div class="focus-label">正在朗读 · 点击可重播</div>
      <div class="focus-text" id="focus-text"></div>
      <div class="focus-meta" id="focus-meta"></div>
    </div>
    <div class="panel" style="margin-top:16px">
      <div class="panel-head">全文逐句 · 点击任意一句跳转朗读</div>
      <div class="sents" id="sents"></div>
    </div>
  </main>

  <aside>
    <div class="panel">
      <div class="vocab-head"><h3>📚 生词速查</h3><span class="hint">点击朗读</span></div>
      <div class="vocab-list" id="vocab"></div>
    </div>
    <div class="panel" style="padding:14px 18px; font-size:13px; color:var(--muted)">
      <b>循环模式</b>：不循环 / 单篇循环（整篇读完自动重头）<br>
      <b>连播</b>：关闭则每句播完停下；<b>🔁 单句</b>：反复朗读当前句。<br>
      快捷键：<kbd>空格</kbd> 播放/暂停 · <kbd>←</kbd><kbd>→</kbd> 上一句/下一句
    </div>
  </aside>
</div>

<div id="lookup" class="lookup hidden">
  <div class="lookup-head">
    <span id="lookup-word" class="lookup-word"></span>
    <span id="lookup-ipa" class="lookup-ipa"></span>
    <button id="lookup-speak" class="lookup-btn" title="朗读">🔊</button>
    <button id="lookup-save" class="lookup-btn" title="加入生词本">☆ 生词本</button>
    <button id="lookup-close" class="lookup-btn" title="关闭">✕</button>
  </div>
  <div id="lookup-zh" class="lookup-zh hidden"></div>
  <div id="lookup-body" class="lookup-body"></div>
</div>

<div id="vn-modal" class="vn-modal hidden">
  <div class="vn-panel">
    <div class="vn-head">
      <h3>📒 生词本 <span id="vn-total" class="hint"></span></h3>
      <button id="vn-export">导出</button>
      <button id="vn-clear">清空</button>
      <button id="vn-close">✕</button>
    </div>
    <div class="vn-list" id="vn-list"></div>
  </div>
</div>

<div id="set-modal" class="vn-modal hidden">
  <div class="vn-panel" style="width:min(700px, calc(100vw - 32px))">
    <div class="vn-head">
      <h3>⚙️ 设置</h3>
      <button id="set-close">✕</button>
    </div>
    <div class="vn-list" id="set-body" style="padding:12px 18px"></div>
  </div>
</div>

<script>
const SENTENCES = __SENTENCES_JSON__;
const VOCAB = __VOCAB_JSON__;

const vocabSet = new Set(VOCAB.map(v => v.word.toLowerCase()));

let idx = 0, playing = false, repeatMode = false, autoMode = true;
let loopMode = "track";  // off=不循环 / track=单篇循环（本篇即列表）
const audio = new Audio();
audio.preload = "auto";

const $ = id => document.getElementById(id);

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => (
    { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]
  ));
}

function wordCore(tok) {
  return tok.replace(/^[^A-Za-zÀ-ÿ’']+/, "").replace(/[^A-Za-zÀ-ÿ’']+$/, "").toLowerCase();
}

function wrapWords(text) {
  return text.split(/(\s+)/).map(tok => {
    if (!tok || /^\s+$/.test(tok)) return tok;
    const core = wordCore(tok);
    if (!core) return esc(tok);
    const cls = vocabSet.has(core) ? "w vw" : "w";
    return `<span class="${cls}" data-w="${esc(core)}">${esc(tok)}</span>`;
  }).join("");
}

function speakWord(w) {
  if (!("speechSynthesis" in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(w);
  u.lang = "en-GB"; u.rate = 0.9;
  speechSynthesis.speak(u);
}

// ---- 查词 ----
function lemmaCandidates(w) {
  const c = [w];
  if (w.endsWith("ies") && w.length > 4) c.push(w.slice(0, -3) + "y");
  if (w.endsWith("es") && w.length > 4) c.push(w.slice(0, -2));
  if (w.endsWith("s") && !w.endsWith("ss") && w.length > 3) c.push(w.slice(0, -1));
  if (w.endsWith("ed") && w.length > 4) c.push(w.slice(0, -2));
  if (w.endsWith("ing") && w.length > 5) c.push(w.slice(0, -3));
  return [...new Set(c)];
}

async function fetchDefinitions(word) {
  let lastErr = new Error("not-found");
  for (const c of lemmaCandidates(word)) {
    try {
      const r = await fetch(`https://api.datamuse.com/words?sp=${encodeURIComponent(c)}&md=d&max=5`);
      if (!r.ok) { lastErr = new Error(`HTTP ${r.status}`); continue; }
      const j = await r.json();
      const hit = (j || []).find(x => (x.word || "").toLowerCase() === c.toLowerCase());
      if (hit && hit.defs && hit.defs.length) return { defs: hit.defs, word: c };
      lastErr = new Error("not-found");
    } catch (e) { lastErr = e; }
  }
  throw lastErr;
}

async function fetchZh(word) {
  try {
    const r = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(word)}&langpair=en|zh-CN`);
    const j = await r.json();
    const t = j && j.responseData && j.responseData.translatedText;
    if (!t || /MYMEMORY WARNING/i.test(t) || t.toLowerCase() === word.toLowerCase()) return "";
    return t;
  } catch { return ""; }
}

const POS = {
  n: "名词", v: "动词", adj: "形容词", adv: "副词",
  prep: "介词", conj: "连词", pron: "代词", interj: "感叹词", u: "",
};

function renderDef(defs, word) {
  $("lookup-ipa").textContent = "";
  let html = "";
  let firstDef = "";
  const seen = new Set();
  for (const d of defs.slice(0, 5)) {
    const parts = d.split("\t");
    const pos = (parts[0] || "").trim();
    const def = (parts[1] || "").trim();
    if (!def || seen.has(pos + def)) continue;
    seen.add(pos + def);
    if (!firstDef) firstDef = def;
    html += `<div class="lookup-pos">${POS[pos] || ""}</div><div class="lookup-def">${esc(def)}</div>`;
  }
  $("lookup-body").innerHTML = html || '<div class="lookup-loading">😕 未找到释义</div>';
  $("lookup-speak").onclick = () => speakWord(word);
  if (lastLookup) { lastLookup.en = firstDef; updateSaveBtn(); }
}

async function lookupWord(word, anchor) {
  document.querySelectorAll(".w.active-lookup").forEach(el => el.classList.remove("active-lookup"));
  if (anchor) anchor.classList.add("active-lookup");
  $("lookup").classList.remove("hidden");
  $("lookup-word").textContent = word;
  $("lookup-ipa").textContent = "";
  $("lookup-zh").classList.add("hidden");
  lastLookup = { word: word, zh: "", en: "" };
  updateSaveBtn();
  $("lookup-body").innerHTML = '<div class="lookup-loading">🔍 查询中…</div>';
  try {
    const { defs, word: found } = await fetchDefinitions(word);
    renderDef(defs, found);
  } catch (e) {
    $("lookup-body").innerHTML = '<div class="lookup-loading">😕 未找到释义（可试试单词原形，或检查网络）</div>';
  }
  const zh = await fetchZh(word);
  if (zh) {
    $("lookup-zh").textContent = "中：" + zh;
    $("lookup-zh").classList.remove("hidden");
    if (lastLookup) lastLookup.zh = zh;
  }
  updateSaveBtn();
}

// ---- 就绪状态（仅服务模式有 /status；静态模式自动忽略）----
let lastStatus = null;
function applyStatus(st) {
  lastStatus = st;
  const badge = $("ready");
  if (badge) badge.textContent = st.done ? `✓ 就绪 ${st.total}` : `⏳ 生成中 ${st.ready}/${st.total}`;
  const art0 = st.articles && st.articles[0];
  if (art0 && art0.mask) {
    document.querySelectorAll("#sents .sent").forEach((row, i) => {
      row.classList.toggle("notready", art0.mask[i] === "0");
    });
  }
}
function pollStatus() {
  fetch("/status", { cache: "no-store" })
    .then(r => { if (!r.ok) throw new Error("no status"); return r.json(); })
    .then(st => { applyStatus(st); if (!st.done) setTimeout(pollStatus, 2000); })
    .catch(() => {});
}

// ---- 生词本（服务模式存文件；静态模式存浏览器 localStorage）----
const VN_KEY = "echo_vocab";
let vocabBook = [];
let vocabServer = false;
let lastLookup = null;

async function vnLoad() {
  try {
    const r = await fetch("/vocab", { cache: "no-store" });
    if (r.ok) { vocabBook = (await r.json()).items || []; vocabServer = true; return; }
  } catch (e) { /* 静态模式，改用 localStorage */ }
  try { vocabBook = JSON.parse(localStorage.getItem(VN_KEY) || "[]") || []; } catch (e) { vocabBook = []; }
}

function vnSaveLocal() {
  try { localStorage.setItem(VN_KEY, JSON.stringify(vocabBook)); } catch (e) {}
}

async function vnPost(path, body) {
  const r = await fetch(path, {
    method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body || {}),
  });
  if (r.ok) vocabBook = (await r.json()).items || vocabBook;
}

function vnHas(word) {
  return vocabBook.some(x => (x.word || "").toLowerCase() === String(word).toLowerCase());
}

async function vnAdd(entry) {
  vocabBook = [entry].concat(vocabBook.filter(x => (x.word || "").toLowerCase() !== entry.word.toLowerCase()));
  if (vocabServer) { try { await vnPost("/vocab/add", entry); } catch (e) {} } else { vnSaveLocal(); }
  renderVocabBook();
}

async function vnRemove(word) {
  vocabBook = vocabBook.filter(x => (x.word || "").toLowerCase() !== String(word).toLowerCase());
  if (vocabServer) { try { await vnPost("/vocab/remove", { word }); } catch (e) {} } else { vnSaveLocal(); }
  renderVocabBook();
}

async function vnClear() {
  vocabBook = [];
  if (vocabServer) { try { await vnPost("/vocab/clear", {}); } catch (e) {} } else { vnSaveLocal(); }
  renderVocabBook();
}

function updateSaveBtn() {
  const btn = $("lookup-save");
  if (!btn || !lastLookup) return;
  const has = vnHas(lastLookup.word);
  btn.textContent = has ? "★ 已加入" : "☆ 生词本";
  btn.classList.toggle("toggle-on", has);
}

function renderVocabBook() {
  const n = vocabBook.length;
  const cnt = $("vn-count");
  if (cnt) cnt.textContent = n ? ` ${n}` : "";
  const total = $("vn-total");
  if (total) total.textContent = n ? `${n} 个` : "";
  const box = $("vn-list");
  if (box) {
    box.innerHTML = n ? vocabBook.map((x, k) => `
      <div class="vn-item">
        <div class="vn-line">
          <span class="vn-word">${esc(x.word)}</span>
          ${x.zh ? `<span class="vn-zh">${esc(x.zh)}</span>` : ""}
          <button class="vn-btn" data-act="speak" data-k="${k}" title="朗读">🔊</button>
          <button class="vn-btn" data-act="jump" data-k="${k}" title="跳回原句">↪</button>
          <button class="vn-btn" data-act="del" data-k="${k}" title="删除">🗑</button>
        </div>
        ${x.en ? `<div class="vn-en">${esc(x.en)}</div>` : ""}
        ${x.note ? `<div class="vn-note">…${esc(x.note)}</div>` : ""}
      </div>`).join("") : '<div class="vn-empty">生词本还是空的。<br>查词时点「☆ 生词本」即可加入。</div>';
  }
  updateSaveBtn();
}

function vnExport() {
  const el = document.createElement("a");
  el.href = URL.createObjectURL(new Blob([JSON.stringify(vocabBook, null, 2)], { type: "application/json" }));
  el.download = "生词本.json";
  el.click();
  URL.revokeObjectURL(el.href);
}

function currentCtx() {
  const s = SENTENCES[idx];
  return { note: s ? s.text : "", src: document.title.split(" · ")[0], a: 0, i: idx };
}

function vnJump(x) {
  if (typeof x.i === "number" && SENTENCES[x.i]) play(x.i);
}

// ---- 设置页（仅服务模式可用）----
let settings = null;

async function setLoad() {
  try {
    const r = await fetch("/settings", { cache: "no-store" });
    if (!r.ok) throw new Error("no settings");
    settings = await r.json();
    return true;
  } catch (e) { return false; }
}

async function setPost(path, body) {
  try {
    const r = await fetch(path, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body || {}),
    });
    return r.ok ? await r.json() : { ok: false, error: "请求失败" };
  } catch (e) { return { ok: false, error: String(e) }; }
}

function renderSettings() {
  if (!settings) return;
  const dirs = settings.search_dirs || [];
  const dirRows = dirs.length
    ? dirs.map((d, i) => `
        <div class="set-item">
          <span class="set-badge">${i === 0 ? "默认" : i + 1}</span>
          <span class="set-path" title="${esc(d)}">${esc(d)}</span>
          <button class="vn-btn" data-reveal="${esc(d)}" title="在 Finder 中显示">📂</button>
          <button class="vn-btn" data-rmdir="${esc(d)}" title="移除">🗑</button>
        </div>`).join("")
    : '<div class="set-empty">还没有添加搜索路径</div>';

  const infoRow = (label, p) => `
    <div class="set-row">
      <span class="set-label">${esc(label)}</span>
      <span class="set-path" title="${esc(p)}">${esc(p)}</span>
      <button class="vn-btn" data-reveal="${esc(p)}" title="在 Finder 中显示">📂</button>
    </div>`;

  $("set-body").innerHTML = `
    <div class="set-section">
      <div class="set-title">搜索路径 <span class="hint">（扫描 md 的目录，第一个为默认）</span></div>
      <div class="set-list">${dirRows}</div>
      <div class="set-add">
        <input id="set-newdir" type="text" placeholder="输入目录绝对路径，如 /Volumes/磁盘/英语学习" />
        <button id="set-addbtn">添加</button>
      </div>
      <div class="set-note">新增的路径会置顶为主路径；修改后需<b>重启 Echo</b> 才会重新扫描文章。</div>
    </div>
    <div class="set-section">
      <div class="set-title">数据与产物路径</div>
      ${infoRow("数据目录", settings.data_dir)}
      ${infoRow("生词本", settings.vocab_file)}
      ${infoRow("学习进度", settings.progress_file)}
      ${infoRow("产物目录", settings.dist_dir)}
      ${infoRow("项目根目录", settings.project_root)}
      <div class="set-add">
        <button id="set-datadir">更改数据目录…</button>
        <button id="set-datadir-reset">恢复默认</button>
      </div>
      <div class="set-note">数据目录决定 config / 生词本 / 学习进度 的存放位置，修改后<b>立即生效</b>。</div>
    </div>`;
}

async function reloadUserData() {
  await vnLoad();
  renderVocabBook();
}

async function openSettings() {
  $("set-modal").classList.remove("hidden");
  if (!settings) {
    $("set-body").innerHTML = '<div class="set-empty">加载中…</div>';
    if (!(await setLoad())) {
      $("set-body").innerHTML =
        '<div class="set-empty">当前模式没有设置页（请用 launch.command 或 Echo.app 启动）</div>';
      return;
    }
  }
  renderSettings();
}

function setActive(i) {
  idx = i;
  document.querySelectorAll(".sent").forEach((el, k) => el.classList.toggle("active", k === i));
  const cur = document.querySelector(".sent.active");
  if (cur) cur.scrollIntoView({ block: "nearest", behavior: "smooth" });
  $("focus-text").innerHTML = wrapWords(SENTENCES[i].text);
  $("focus-meta").textContent = `第 ${i + 1} / ${SENTENCES.length} 句`;
  $("counter").textContent = `${i + 1} / ${SENTENCES.length}`;
  $("progress").style.width = `${((i + 1) / SENTENCES.length) * 100}%`;
  $("focus-text").onclick = e => {
    const w = e.target.closest(".w");
    if (w) lookupWord(w.dataset.w, w);
    else play(i);
  };
}

function play(i) {
  if (i !== undefined) idx = i;
  audio.src = SENTENCES[idx].audio;
  audio.playbackRate = parseFloat($("speed").value);
  audio.play().then(() => { playing = true; renderPlay(); }).catch(() => {});
  setActive(idx);
}

function nextSentence() {
  if (idx < SENTENCES.length - 1) { play(idx + 1); return; }
  if (loopMode !== "off") { play(0); return; }   // 单篇循环 → 重头
  audio.pause(); playing = false; renderPlay();
}

function prevSentence() {
  if (idx > 0) { play(idx - 1); return; }
  if (loopMode !== "off") { play(SENTENCES.length - 1); return; }
  play(0);
}

function pause() {
  audio.pause(); playing = false; renderPlay();
}

function togglePlay() {
  if (playing) pause();
  else play(idx);
}

function renderPlay() {
  $("play").textContent = playing ? "⏸" : "▶";
}

audio.addEventListener("ended", () => {
  if (repeatMode) { audio.currentTime = 0; audio.play(); return; }   // 单句循环
  if (!autoMode) { playing = false; renderPlay(); return; }          // 未开连播
  if (idx < SENTENCES.length - 1) { play(idx + 1); return; }         // 下一句
  if (loopMode !== "off") { play(0); return; }                       // 单篇循环
  playing = false; renderPlay();
});

// 构建句子列表
$("sents").innerHTML = SENTENCES.map((s, i) =>
  `<div class="sent" data-i="${i}"><span class="idx">${i + 1}</span><span class="txt">${wrapWords(s.text)}</span></div>`
).join("");
$("sents").addEventListener("click", e => {
  const w = e.target.closest(".w");
  if (w) { lookupWord(w.dataset.w, w); return; }
  const row = e.target.closest(".sent");
  if (row) play(parseInt(row.dataset.i, 10));
});

// 构建生词面板
$("vocab").innerHTML = VOCAB.map(v =>
  `<div class="vocab-item" data-w="${v.word}">
     <div class="vw-line"><span class="vw-word">${v.word}</span><span class="vw-ipa">${v.phonetic}</span><span class="speaker">🔊</span></div>
     <div class="vw-mean">${v.meaning}</div>
     <div class="vw-ex">${v.example}</div>
   </div>`
).join("");
$("vocab").addEventListener("click", e => {
  const item = e.target.closest(".vocab-item");
  if (item) { speakWord(item.dataset.w); lookupWord(item.dataset.w, item); }
});

// 控件
$("play").addEventListener("click", togglePlay);
$("prev").addEventListener("click", prevSentence);
$("next").addEventListener("click", nextSentence);
$("speed").addEventListener("change", () => { audio.playbackRate = parseFloat($("speed").value); });
$("loop").addEventListener("change", () => { loopMode = $("loop").value; });
$("repeat").addEventListener("click", () => {
  repeatMode = !repeatMode;
  $("repeat").classList.toggle("toggle-on", repeatMode);
});
$("auto").addEventListener("click", () => {
  autoMode = !autoMode;
  $("auto").classList.toggle("toggle-on", autoMode);
});

// 查词卡片关闭
$("lookup-close").addEventListener("click", () => $("lookup").classList.add("hidden"));
document.addEventListener("click", e => {
  const card = $("lookup");
  if (card.classList.contains("hidden")) return;
  if (card.contains(e.target)) return;
  if (e.target.closest(".w, .vocab-item")) return;
  card.classList.add("hidden");
});

// 键盘快捷键
document.addEventListener("keydown", e => {
  for (const id of ["vn-modal", "set-modal"]) {
    const modal = $(id);
    if (modal && !modal.classList.contains("hidden")) {
      if (e.key === "Escape") modal.classList.add("hidden");
      return;
    }
  }
  if (e.target.tagName === "SELECT" || e.target.tagName === "INPUT") return;
  if (e.code === "Space") { e.preventDefault(); togglePlay(); }
  else if (e.key === "ArrowLeft") prevSentence();
  else if (e.key === "ArrowRight") nextSentence();
  else if (e.key === "Escape") { $("lookup").classList.add("hidden"); }
});

// ---- 生词本事件 ----
$("vn-open").addEventListener("click", () => { renderVocabBook(); $("vn-modal").classList.remove("hidden"); });
$("vn-close").addEventListener("click", () => $("vn-modal").classList.add("hidden"));
$("vn-modal").addEventListener("click", e => { if (e.target.id === "vn-modal") $("vn-modal").classList.add("hidden"); });
$("vn-export").addEventListener("click", vnExport);
$("vn-clear").addEventListener("click", () => { if (confirm("确定清空生词本？")) vnClear(); });
$("vn-list").addEventListener("click", e => {
  const b = e.target.closest(".vn-btn");
  if (!b) return;
  const item = vocabBook[parseInt(b.dataset.k, 10)];
  if (!item) return;
  if (b.dataset.act === "speak") speakWord(item.word);
  else if (b.dataset.act === "del") vnRemove(item.word);
  else if (b.dataset.act === "jump") { $("vn-modal").classList.add("hidden"); vnJump(item); }
});
$("lookup-save").addEventListener("click", () => {
  if (!lastLookup) return;
  if (vnHas(lastLookup.word)) {
    vnRemove(lastLookup.word);
  } else {
    const c = currentCtx();
    vnAdd({ word: lastLookup.word, zh: lastLookup.zh || "", en: lastLookup.en || "",
            note: c.note, src: c.src, a: c.a, i: c.i });
  }
});

// ---- 设置事件 ----
$("set-open").addEventListener("click", openSettings);
$("set-close").addEventListener("click", () => $("set-modal").classList.add("hidden"));
$("set-modal").addEventListener("click", e => {
  if (e.target.id === "set-modal") $("set-modal").classList.add("hidden");
});
$("set-body").addEventListener("click", async e => {
  const rev = e.target.closest("[data-reveal]");
  if (rev) {
    const r = await setPost("/settings/reveal", { path: rev.dataset.reveal });
    if (!r.ok) alert("无法打开：" + (r.error || ""));
    return;
  }
  const rm = e.target.closest("[data-rmdir]");
  if (rm) {
    await setPost("/settings/remove_search_dir", { dir: rm.dataset.rmdir });
    await setLoad();
    renderSettings();
    return;
  }
  if (e.target.id === "set-addbtn") {
    const v = ($("set-newdir").value || "").trim();
    if (!v) return;
    const r = await setPost("/settings/add_search_dir", { dir: v });
    if (!r.ok) { alert("添加失败：" + (r.error || "")); return; }
    $("set-newdir").value = "";
    await setLoad();
    renderSettings();
    return;
  }
  if (e.target.id === "set-datadir" || e.target.id === "set-datadir-reset") {
    const reset = e.target.id === "set-datadir-reset";
    let v = "";
    if (!reset) {
      v = prompt("输入新的数据目录绝对路径（留空则恢复默认）：", settings ? settings.data_dir : "");
      if (v === null) return;
    }
    const r = await setPost("/settings/data_dir", { dir: v });
    if (!r.ok) { alert("设置失败：" + (r.error || "")); return; }
    await setLoad();
    renderSettings();
    await reloadUserData();
    return;
  }
});

setActive(0);
pollStatus();
vnLoad().then(renderVocabBook);
setLoad().then(ok => { if (!ok) $("set-open").style.display = "none"; });
</script>
</body>
</html>
