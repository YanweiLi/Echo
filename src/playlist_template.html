<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Echo · 播放列表</title>
<style>
  :root {
    --bg: #f7f5f1;
    --card: #ffffff;
    --ink: #1c1b18;
    --muted: #8a857a;
    --accent: #c0392b;
    --accent-soft: #fbeae7;
    --line: #e8e4dc;
    --serif: Georgia, "Times New Roman", "Songti SC", serif;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: var(--sans); line-height: 1.6;
  }

  header {
    position: sticky; top: 0; z-index: 10;
    background: rgba(247, 245, 241, .86); backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--line); padding: 12px 20px;
  }
  .bar {
    max-width: 1280px; margin: 0 auto;
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  }
  .title { font-family: var(--serif); font-size: 17px; font-weight: 700; white-space: nowrap; }
  .issue-sel { font-size: 13px; padding: 5px 8px; border: 1px solid var(--line);
               border-radius: 8px; background: var(--card); color: var(--ink);
               max-width: 190px; }
  .issue-sel.hidden { display: none; }
  .controls { display: flex; align-items: center; gap: 8px; }
  button {
    font-family: inherit; cursor: pointer; border: 1px solid var(--line);
    background: var(--card); color: var(--ink); border-radius: 10px;
    padding: 7px 12px; font-size: 14px; transition: .15s;
  }
  button:hover { border-color: var(--accent); color: var(--accent); }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); min-width: 52px; font-size: 16px; }
  button.primary:hover { filter: brightness(1.08); color: #fff; }
  button.toggle-on { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }
  select {
    font-family: inherit; font-size: 14px; padding: 6px 8px;
    border: 1px solid var(--line); border-radius: 10px; background: var(--card); color: var(--ink);
  }
  .meta { color: var(--muted); font-size: 13px; }
  .spacer { flex: 1; }
  .progress-track { height: 5px; background: var(--line); border-radius: 3px; overflow: hidden; }
  .progress-fill { height: 100%; width: 0%; background: var(--accent); transition: width .2s linear; }

  /* ---- 播放区：悬浮在底部上方（固定，不随内容变化）---- */
  .player-dock {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; padding-bottom: 16px;
    pointer-events: none;
  }
  .dock-inner {
    max-width: 1280px; margin: 0 auto; padding: 0 20px; display: grid;
    grid-template-columns: 250px minmax(0, 1fr) 270px; gap: 18px;
  }
  .player {
    grid-column: 2; pointer-events: auto;
    background: rgba(255, 255, 255, .95); backdrop-filter: blur(12px);
    box-shadow: 0 10px 30px rgba(28, 27, 24, .16); padding: 14px 16px 12px;
  }
  .player-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .player-meta { display: flex; align-items: center; gap: 14px; margin-top: 10px; flex-wrap: wrap; }
  .player .progress-track { margin-top: 10px; }
  @media (max-width: 980px) {
    .dock-inner { grid-template-columns: 1fr; }
    .player { grid-column: 1; }
  }

  .layout {
    max-width: 1280px; margin: 20px auto 170px; padding: 0 20px;
    display: grid; grid-template-columns: 250px minmax(0, 1fr) 270px; gap: 18px; align-items: start;
  }
  @media (max-width: 980px) { .layout { grid-template-columns: 1fr; } }

  .panel { background: var(--card); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; box-shadow: 0 2px 10px rgba(28,27,24,.04); }
  .panel-head { padding: 12px 16px; font-size: 13px; color: var(--muted); border-bottom: 1px solid var(--line); }

  /* 播放列表 */
  .pl-list { max-height: 72vh; overflow-y: auto; }
  .pl-item {
    display: flex; align-items: center; gap: 8px; padding: 10px 14px; cursor: pointer;
    border-bottom: 1px solid var(--line); transition: background .15s;
  }
  .pl-item:last-child { border-bottom: none; }
  .pl-item:hover { background: #fbfaf7; }
  .pl-item.active { background: var(--accent-soft); }
  .pl-idx { color: var(--muted); font-size: 12px; min-width: 20px; font-variant-numeric: tabular-nums; }
  .pl-item.active .pl-idx { color: var(--accent); font-weight: 700; }
  .pl-label { font-size: 14px; flex: 1; }
  .pl-n { color: var(--muted); font-size: 12px; }

  /* 焦点句 */
  .focus { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 20px 24px; box-shadow: 0 2px 10px rgba(28,27,24,.04); }
  .focus-label { color: var(--accent); font-size: 12px; letter-spacing: .06em; margin-bottom: 8px; }
  .focus-text { font-family: var(--serif); font-size: 30px; line-height: 1.55; }
  .focus-meta { margin-top: 10px; color: var(--muted); font-size: 13px; }
  .sent.active .txt { font-weight: 600; }

  .sents { max-height: max(240px, calc(100vh - 520px)); overflow-y: auto; }
  .sent { display: flex; flex-wrap: wrap; gap: 12px; padding: 11px 16px; cursor: pointer; border-bottom: 1px solid var(--line); transition: background .15s; }
  .sent:last-child { border-bottom: none; }
  .sent:hover { background: #fbfaf7; }
  .sent .idx { color: var(--muted); font-size: 12px; min-width: 26px; text-align: right; padding-top: 3px; font-variant-numeric: tabular-nums; }
  .sent .txt { font-family: var(--serif); font-size: 15.5px; flex: 1; min-width: 0; }
  .sent.active { background: var(--accent-soft); }
  .sent.active .idx { color: var(--accent); font-weight: 700; }
  .sent.notready .txt { opacity: .38; }
  .sent.notready .idx { color: #d9d2c5; }

  /* ---- 句中译：默认不显示，点击「译」才展开 ---- */
  .zh-btn {
    flex: none; align-self: flex-start; margin-top: 2px; padding: 0 7px;
    font-size: 11px; line-height: 1.85; border-radius: 7px; color: var(--muted);
    opacity: .5; transition: .15s;
  }
  .sent:hover .zh-btn { opacity: .9; }
  .zh-btn:hover, .zh-btn.on { opacity: 1; border-color: var(--accent); color: var(--accent); }
  .zh-btn.on { background: var(--accent-soft); }
  .zh {
    flex-basis: 100%; margin: 6px 0 0 38px; padding-left: 10px;
    border-left: 2px solid var(--accent-soft);
    font-size: 14.5px; line-height: 1.75; color: #5d574c;
  }
  .zh.err { color: var(--muted); font-size: 13px; }
  .focus-zh {
    margin-top: 12px; padding-top: 10px; border-top: 1px dashed var(--line);
    font-size: 18px; line-height: 1.75; color: #5d574c;
  }
  .focus-zh.hidden { display: none; }
  .focus-zh.err { color: var(--muted); font-size: 14px; }

  /* ---- AI 拆解抽屉（右侧，不遮住原文）---- */
  .ai-drawer {
    position: fixed; top: 0; right: 0; bottom: 0; z-index: 55;
    width: min(560px, 92vw); display: flex; flex-direction: column;
    background: var(--card); border-left: 1px solid var(--line);
    box-shadow: -12px 0 40px rgba(28, 27, 24, .16);
  }
  .ai-head { display: flex; align-items: center; gap: 8px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
  .ai-head h3 { margin: 0; font-size: 15px; flex: none; }
  .ai-model { flex: 1; min-width: 0; color: var(--muted); font-size: 12px;
              font-family: ui-monospace, Menlo, monospace;
              overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ai-head button { font-size: 13px; padding: 5px 10px; }
  .ai-sent { padding: 12px 16px; border-bottom: 1px solid var(--line);
             background: #fcfaf6; cursor: pointer;
             font-family: var(--serif); font-size: 15px; line-height: 1.7; }
  .ai-body { flex: 1; overflow-y: auto; padding: 4px 16px 16px; }
  .ai-sec { margin-top: 14px; }
  .ai-sec-t { font-size: 12px; letter-spacing: .06em; color: var(--accent);
              font-weight: 600; margin-bottom: 6px; }
  .ai-body p { margin: 0 0 6px; font-size: 14.5px; line-height: 1.75; }
  .ai-item { padding: 7px 0 7px 10px; border-left: 2px solid var(--accent-soft);
             margin-bottom: 7px; font-size: 14.5px; line-height: 1.7; }
  .ai-item b { color: #0b6e4f; font-weight: 600; }
  .ai-ref { font-family: ui-monospace, Menlo, monospace; font-size: 13.5px; }
  .ai-why { color: var(--muted); font-size: 13.5px; margin-top: 2px; }
  .ai-tr { font-size: 15px; }
  .ai-foot { padding: 10px 16px; border-top: 1px solid var(--line);
             color: var(--muted); font-size: 12.5px;
             display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .ai-foot button { font-size: 13px; padding: 5px 10px; }
  .ai-loading { color: var(--muted); font-size: 14px; padding: 22px 0; text-align: center; }
  .ai-err { color: var(--accent); font-size: 14px; padding: 14px 0; line-height: 1.7; }
  .ai-empty { color: var(--muted); font-size: 14px; padding: 10px 0; }
  @media (max-width: 820px) { .ai-drawer { width: 100vw; border-left: none; } }

  .w { cursor: pointer; border-radius: 4px; padding: 0 1px; transition: background .12s; }
  .w:hover { background: #f3e6c8; }
  .w.active-lookup { background: #ffe08a; }
  .vw { color: var(--accent); font-weight: 600; border-bottom: 1px dotted rgba(192,57,43,.5); }
  .vw.w { cursor: pointer; }

  .vocab-col { position: sticky; top: 86px; display: flex; flex-direction: column; gap: 16px; }
  .vocab-head { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-bottom: 1px solid var(--line); }
  .vocab-head h3 { margin: 0; font-size: 14px; }
  .vocab-list { max-height: 58vh; overflow-y: auto; }
  .vocab-item { padding: 10px 16px; border-bottom: 1px solid var(--line); cursor: pointer; transition: background .15s; }
  .vocab-item:hover { background: #fbfaf7; }
  .vocab-item:last-child { border-bottom: none; }
  .vw-line { display: flex; align-items: baseline; gap: 8px; }
  .vw-word { font-family: var(--serif); font-size: 17px; font-weight: 700; }
  .vw-ipa { color: var(--muted); font-size: 13px; }
  .vw-mean { font-size: 13.5px; margin-top: 2px; }
  .vw-ex { color: var(--muted); font-size: 12.5px; font-style: italic; margin-top: 2px; }
  .speaker { color: var(--accent); font-size: 13px; margin-left: auto; }

  .hint { color: var(--muted); font-size: 12px; }
  kbd { background: var(--card); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 5px; padding: 1px 6px; font-size: 11px; }

  .hidden { display: none !important; }
  .lookup {
    position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
    width: min(420px, calc(100vw - 24px)); max-height: 48vh; overflow: auto;
    background: #fffdf8; border: 1px solid var(--line); border-radius: 14px;
    box-shadow: 0 10px 30px rgba(28,27,24,.16); z-index: 50; padding: 12px 16px;
  }
  .lookup-head { display: flex; align-items: baseline; gap: 10px; }
  .lookup-word { font-family: var(--serif); font-size: 21px; font-weight: 700; }
  .lookup-ipa { color: var(--muted); font-size: 13px; }
  .lookup-btn { border: none; background: none; cursor: pointer; font-size: 15px; color: var(--accent); padding: 2px 6px; }
  .lookup-zh { margin-top: 6px; font-size: 15px; color: #0b6e4f; font-weight: 500; }
  .lookup-pos { font-style: italic; color: var(--accent); font-size: 13px; margin: 8px 0 2px; }
  .lookup-def { font-size: 14px; margin-top: 2px; }
  .lookup-ex { color: var(--muted); font-size: 13px; font-style: italic; margin-top: 2px; }
  .lookup-loading { color: var(--muted); font-size: 14px; }

  /* ---- 生词本 ---- */
  #vn-count { font-size: 12px; }
  #lookup-save { font-size: 13px; }
  .lookup-btn.toggle-on { background: var(--accent-soft); border-radius: 8px; color: var(--accent); }
  .vn-modal {
    position: fixed; inset: 0; background: rgba(28,27,24,.35); z-index: 60;
    display: flex; align-items: center; justify-content: center;
  }
  .vn-panel {
    width: min(560px, calc(100vw - 32px)); max-height: 76vh; display: flex; flex-direction: column;
    background: var(--card); border: 1px solid var(--line); border-radius: 16px;
    box-shadow: 0 16px 48px rgba(28,27,24,.28); overflow: hidden;
  }
  .vn-head { display: flex; align-items: center; gap: 8px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
  .vn-head h3 { margin: 0; font-size: 15px; flex: 1; }
  .vn-head button { font-size: 13px; padding: 5px 10px; }
  .vn-list { overflow-y: auto; padding: 4px 0; }
  .vn-item { padding: 10px 16px; border-bottom: 1px solid var(--line); }
  .vn-item:last-child { border-bottom: none; }
  .vn-line { display: flex; align-items: baseline; gap: 8px; }
  .vn-word { font-family: var(--serif); font-size: 17px; font-weight: 700; }
  .vn-zh { color: #0b6e4f; font-size: 13.5px; }
  .vn-btn { border: none; background: none; cursor: pointer; font-size: 14px; padding: 2px 4px; color: var(--muted); }
  .vn-btn:hover { color: var(--accent); }
  .vn-btn[data-act="del"] { margin-left: auto; }
  .vn-en { font-size: 13px; margin-top: 3px; }
  .vn-note { font-size: 12.5px; color: var(--muted); font-style: italic; margin-top: 3px; }
  .vn-empty { padding: 28px 16px; text-align: center; color: var(--muted); font-size: 14px; }

  /* ---- 学习进度（标记完成）---- */
  .pl-item.done .pl-label { color: var(--muted); }
  .pl-item.done .pl-idx { color: #2e7d32; font-weight: 700; }
  .focus-top { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .focus-top .focus-label { margin-bottom: 0; flex: 1; }
  .mark-btn {
    border: 1px solid var(--line); background: var(--card); color: var(--muted);
    border-radius: 10px; padding: 5px 12px; font-size: 13px; cursor: pointer; font-family: inherit;
    white-space: nowrap;
  }
  .mark-btn:hover { border-color: #2e7d32; color: #2e7d32; }
  .mark-btn.done { background: #e8f5e9; border-color: #2e7d32; color: #2e7d32; font-weight: 600; }

  /* ---- 设置页 ---- */
  .set-section { padding: 4px 0 14px; border-bottom: 1px solid var(--line); }
  .set-section:last-child { border-bottom: none; padding-bottom: 4px; }
  .set-row input[type=text], .set-row input[type=password], .set-row select {
    flex: 1; min-width: 0; font-family: inherit; font-size: 13px; padding: 6px 8px;
    border: 1px solid var(--line); border-radius: 8px; background: var(--card); color: var(--ink);
  }
  .set-title { font-size: 13px; font-weight: 600; color: var(--accent); margin-bottom: 8px; }
  .set-title .hint { font-weight: 400; }
  .set-list { display: flex; flex-direction: column; gap: 6px; }
  .set-item, .set-row { display: flex; align-items: center; gap: 8px; font-size: 13px; }
  .set-row { margin-bottom: 7px; }
  .set-label { color: var(--muted); min-width: 78px; flex-shrink: 0; }
  .set-badge { background: var(--accent-soft); color: var(--accent); border-radius: 6px; padding: 1px 6px; font-size: 11px; flex-shrink: 0; }
  .set-path { flex: 1; font-family: ui-monospace, Menlo, monospace; font-size: 12px;
              overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .set-empty { color: var(--muted); font-size: 13px; }
  .set-add { display: flex; gap: 8px; margin-top: 10px; align-items: center; flex-wrap: wrap; }
  .set-add input { flex: 1; min-width: 240px; font-family: ui-monospace, Menlo, monospace; font-size: 12px;
                   padding: 6px 10px; border: 1px solid var(--line); border-radius: 8px;
                   background: var(--card); color: var(--ink); }
  .set-add button { font-size: 13px; padding: 6px 12px; }
  .set-note { color: var(--muted); font-size: 12px; margin-top: 8px; line-height: 1.6; }
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="title">🎧 Echo · 英语学习播放列表</div>
    <select id="issue" class="issue-sel hidden" title="切换期号"></select>
    <div class="spacer"></div>
    <button id="vn-open" title="生词本">📒<span id="vn-count"></span></button>
    <button id="set-open" title="设置">⚙️</button>
  </div>
</header>

<div class="layout">
  <aside>
    <div class="panel">
      <div class="panel-head">📋 播放列表 <span id="pl-count" class="hint"></span></div>
      <div class="pl-list" id="pl-list"></div>
    </div>
  </aside>

  <main>
    <div class="focus">
      <div class="focus-top">
        <div class="focus-label" id="focus-label"></div>
        <button id="zh-toggle" class="zh-btn" title="显示本句中文翻译（快捷键 T）">译</button>
        <button id="ai-open" class="zh-btn" title="AI 拆解这句（快捷键 E）">析</button>
        <button id="mark-done" class="mark-btn" title="标记本篇学习完成">✓ 标记完成</button>
      </div>
      <div class="focus-text" id="focus-text"></div>
      <div class="focus-zh hidden" id="focus-zh"></div>
      <div class="focus-meta" id="focus-meta"></div>
    </div>
    <div class="panel" style="margin-top:16px">
      <div class="panel-head" id="sents-head"></div>
      <div class="sents" id="sents"></div>
    </div>
  </main>

  <aside class="vocab-col">
    <div class="panel">
      <div class="vocab-head"><h3>📚 生词速查</h3><span class="hint">点击朗读</span></div>
      <div class="vocab-list" id="vocab"></div>
    </div>
    <div class="panel" style="padding:14px 16px; font-size:13px; color:var(--muted)">
      <b>循环模式</b>：<br>
      · 单篇循环 —— 一篇读完自动重播该篇<br>
      · 列表循环 —— 全部读完回到第一篇<br>
      <b>连播</b>：关闭则每句播完停下；<b>🔁 单句</b>：反复朗读当前句。<br>
      快捷键：<kbd>空格</kbd> 播放/暂停 · <kbd>←</kbd><kbd>→</kbd> 上一句/下一句 · <kbd>Esc</kbd> 关闭弹窗<br>
      点击左侧列表切换文章；正文任意单词可点击查词。
    </div>
  </aside>
</div>

<div class="player-dock">
  <div class="dock-inner">
    <section class="panel player">
      <div class="player-row">
        <button id="prev" title="上一句 (←)">⏮</button>
        <button id="play" class="primary" title="播放/暂停 (空格)">▶</button>
        <button id="next" title="下一句 (→)">⏭</button>
        <div class="spacer"></div>
        <select id="speed" title="语速">
          <option value="0.5">0.5×</option>
          <option value="0.75">0.75×</option>
          <option value="0.9">0.9×</option>
          <option value="1.0" selected>1.0×</option>
          <option value="1.25">1.25×</option>
          <option value="1.5">1.5×</option>
          <option value="2.0">2.0×</option>
        </select>
        <button id="repeat" title="单句循环">🔁 单句</button>
        <button id="auto" class="toggle-on" title="自动连播">连播</button>
        <select id="loop" title="循环模式">
          <option value="off">不循环</option>
          <option value="track">单篇循环</option>
          <option value="list" selected>列表循环</option>
        </select>
      </div>
      <div class="player-meta">
        <span class="meta" id="counter"></span>
        <span class="meta" id="ready"></span>
        <span class="hint">空格 播放/暂停 · ←→ 切句 · 点击句子跳转</span>
      </div>
      <div class="progress-track"><div class="progress-fill" id="progress"></div></div>
    </section>
  </div>
</div>

<aside id="ai-drawer" class="ai-drawer hidden">
  <div class="ai-head">
    <h3>🔍 AI 拆解</h3>
    <span class="ai-model" id="ai-model"></span>
    <button id="ai-regen" title="重新生成（忽略缓存）">↻</button>
    <button id="ai-close" title="关闭（Esc）">✕</button>
  </div>
  <div class="ai-sent" id="ai-sent" title="点击重听这句"></div>
  <div class="ai-body" id="ai-body"></div>
  <div class="ai-foot" id="ai-foot"></div>
</aside>

<div id="lookup" class="lookup hidden">
  <div class="lookup-head">
    <span id="lookup-word" class="lookup-word"></span>
    <span id="lookup-ipa" class="lookup-ipa"></span>
    <button id="lookup-speak" class="lookup-btn" title="朗读">🔊</button>
    <button id="lookup-save" class="lookup-btn" title="加入生词本">☆ 生词本</button>
    <button id="lookup-close" class="lookup-btn" title="关闭">✕</button>
  </div>
  <div id="lookup-zh" class="lookup-zh hidden"></div>
  <div id="lookup-body" class="lookup-body"></div>
</div>

<script>
const ISSUES = __ISSUES_JSON__;
let ARTICLES = __ARTICLES_JSON__;
let curIssue = __CURRENT_ISSUE__;
const issueCache = {};
let vocabCache = [];
let totalSentences = 0;

function indexArticles() {
  vocabCache = ARTICLES.map(ar => new Set((ar.vocab || []).map(v => v.word.toLowerCase())));
  totalSentences = ARTICLES.reduce((s, ar) => s + ar.sentences.length, 0);
}
indexArticles();

let a = 0, idx = 0, playing = false, repeatMode = false, autoMode = true;
let loopMode = "list";  // off=不循环 / track=单篇循环 / list=列表循环
const audio = new Audio();
audio.preload = "auto";
const $ = id => document.getElementById(id);
const art = () => ARTICLES[a];

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => (
    { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]
  ));
}

function wordCore(tok) {
  return tok.replace(/^[^A-Za-zÀ-ÿ’']+/, "").replace(/[^A-Za-zÀ-ÿ’']+$/, "").toLowerCase();
}

function wrapWords(text) {
  const set = vocabCache[a];
  return text.split(/(\s+)/).map(tok => {
    if (!tok || /^\s+$/.test(tok)) return tok;
    const core = wordCore(tok);
    if (!core) return esc(tok);
    const cls = set.has(core) ? "w vw" : "w";
    return `<span class="${cls}" data-w="${esc(core)}">${esc(tok)}</span>`;
  }).join("");
}

function speakWord(w) {
  if (!("speechSynthesis" in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(w);
  u.lang = "en-GB"; u.rate = 0.9;
  speechSynthesis.speak(u);
}

// ---- 查词 ----
function lemmaCandidates(w) {
  const c = [w];
  if (w.endsWith("ies") && w.length > 4) c.push(w.slice(0, -3) + "y");
  if (w.endsWith("es") && w.length > 4) c.push(w.slice(0, -2));
  if (w.endsWith("s") && !w.endsWith("ss") && w.length > 3) c.push(w.slice(0, -1));
  if (w.endsWith("ed") && w.length > 4) c.push(w.slice(0, -2));
  if (w.endsWith("ing") && w.length > 5) c.push(w.slice(0, -3));
  return [...new Set(c)];
}

async function fetchDefinitions(word) {
  let lastErr = new Error("not-found");
  for (const c of lemmaCandidates(word)) {
    try {
      const r = await fetch(`https://api.datamuse.com/words?sp=${encodeURIComponent(c)}&md=d&max=5`);
      if (!r.ok) { lastErr = new Error(`HTTP ${r.status}`); continue; }
      const j = await r.json();
      const hit = (j || []).find(x => (x.word || "").toLowerCase() === c.toLowerCase());
      if (hit && hit.defs && hit.defs.length) return { defs: hit.defs, word: c };
      lastErr = new Error("not-found");
    } catch (e) { lastErr = e; }
  }
  throw lastErr;
}

async function fetchZh(word) {
  try {
    const r = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(word)}&langpair=en|zh-CN`);
    const j = await r.json();
    const t = j && j.responseData && j.responseData.translatedText;
    if (!t || /MYMEMORY WARNING/i.test(t) || t.toLowerCase() === word.toLowerCase()) return "";
    return t;
  } catch { return ""; }
}

const POS = {
  n: "名词", v: "动词", adj: "形容词", adv: "副词",
  prep: "介词", conj: "连词", pron: "代词", interj: "感叹词", u: "",
};

// ---- 句子中译：默认不显示，点「译」才请求并展开（结果本地缓存）----
const zhSentCache = {};

async function fetchZhSentence(text) {
  if (zhSentCache[text]) return zhSentCache[text];
  let out = null;
  try {
    const r = await fetch(`/translate?text=${encodeURIComponent(text)}`, { cache: "no-store" });
    if (!r.ok) throw new Error("HTTP " + r.status);
    out = await r.json();
  } catch (e) {
    out = await zhDirect(text);          // 静态模式兜底：直接用 MyMemory
  }
  if (out && out.ok) zhSentCache[text] = out;
  return out || { ok: false, error: "翻译失败" };
}

async function zhDirect(text) {
  try {
    const url = "https://api.mymemory.translated.net/get?langpair=en|zh-CN&q=" +
                encodeURIComponent(text.slice(0, 480));
    const d = await (await fetch(url)).json();
    const zh = d && d.responseData && d.responseData.translatedText;
    return zh ? { ok: true, zh } : { ok: false, error: (d && d.responseDetails) || "翻译服务无响应" };
  } catch (e) { return { ok: false, error: String(e) }; }
}

// 句子列表里那一行：点「译」展开 / 再点收起
async function toggleSentenceZh(btn, text) {
  const row = btn.closest(".sent");
  const old = row.querySelector(".zh");
  if (old) { old.remove(); btn.classList.remove("on"); return; }
  btn.classList.add("on");
  const box = document.createElement("div");
  box.className = "zh";
  box.textContent = "翻译中…";
  row.appendChild(box);
  const r = await fetchZhSentence(text);
  box.textContent = r.ok ? r.zh : "（" + (r.error || "翻译失败") + "）";
  if (!r.ok) box.classList.add("err");
}

// 焦点句（正在朗读）的译文
let focusZhOn = false;
async function toggleFocusZh(text) {
  const box = $("focus-zh"), btn = $("zh-toggle");
  if (focusZhOn) {
    focusZhOn = false;
    box.classList.add("hidden");
    btn.classList.remove("on");
    return;
  }
  focusZhOn = true;
  btn.classList.add("on");
  box.className = "focus-zh";
  box.textContent = "翻译中…";
  const r = await fetchZhSentence(text);
  box.textContent = r.ok ? r.zh : "（" + (r.error || "翻译失败") + "）";
  if (!r.ok) box.classList.add("focus-zh", "err");
}

// ---- AI 句子拆解（点击才请求；结果在服务端永久缓存）----
let aiOpenIndex = null;
let aiTimer = null;
const escBr = s => esc(String(s == null ? "" : s)).replace(/\n/g, "<br>");

function aiCtx(i) {
  const ss = art().sentences;
  return {
    title: art().title || "",
    prev: i > 0 ? (ss[i - 1] || {}).text || "" : "",
    next: (ss[i + 1] || {}).text || "",
  };
}

async function fetchExplain(text, ctx, force) {
  const q = new URLSearchParams({
    text, force: force ? "1" : "0",
    title: ctx.title || "", prev: ctx.prev || "", next: ctx.next || "",
  });
  const r = await fetch("/explain?" + q.toString(), { cache: "no-store" });
  if (!r.ok) throw new Error("HTTP " + r.status);
  return await r.json();
}

function aiSec(title, inner) {
  return inner ? `<div class="ai-sec"><div class="ai-sec-t">${title}</div>${inner}</div>` : "";
}

function renderExplain(res) {
  $("ai-model").textContent = res.model || "";
  if (!res.ok) {
    $("ai-body").innerHTML = `<div class="ai-err">⚠️ ${escBr(res.error || "拆解失败")}</div>`;
    $("ai-foot").innerHTML = res.need_config
      ? '<button id="ai-gosetup">去设置 AI</button>'
      : '<button id="ai-retry">重试</button>';
    const g = $("ai-gosetup");
    if (g) g.onclick = () => { closeAiDrawer(); openSettings(); };
    const rt = $("ai-retry");
    if (rt) rt.onclick = () => openAiDrawer(aiOpenIndex, true);
    return;
  }
  const d = res.data || {};
  const parts = [];
  if (d.raw) parts.push(aiSec("拆解", `<p>${escBr(d.raw)}</p>`));
  parts.push(aiSec("句子骨架", d.skeleton ? `<p>${escBr(d.skeleton)}</p>` : ""));
  if (Array.isArray(d.grammar) && d.grammar.length) parts.push(aiSec("语法点",
    d.grammar.map(g => `<div class="ai-item"><b>${esc(g.point || "")}</b><div>${escBr(g.explain || "")}</div></div>`).join("")));
  if (Array.isArray(d.phrases) && d.phrases.length) parts.push(aiSec("难词与短语",
    d.phrases.map(p => `<div class="ai-item"><b>${esc(p.text || "")}</b> ${esc(p.mean || "")}${p.why ? `<div class="ai-why">${escBr(p.why)}</div>` : ""}</div>`).join("")));
  if (Array.isArray(d.reference) && d.reference.length) parts.push(aiSec("指代解析",
    d.reference.map(r => `<div class="ai-item ai-ref"><b>${esc(r.word || "")}</b> → ${esc(r.refers || "")}</div>`).join("")));
  parts.push(aiSec("地道翻译", d.translation ? `<p class="ai-tr">${escBr(d.translation)}</p>` : ""));
  parts.push(aiSec("可仿写句型", d.pattern ? `<p>${escBr(d.pattern)}</p>` : ""));
  $("ai-body").innerHTML = parts.join("") || '<div class="ai-empty">模型没有返回可显示的内容</div>';
  $("ai-foot").innerHTML = (res.cached ? "✓ 来自本地缓存（未消耗额度）" : "✓ 已生成并缓存") +
    '<button id="ai-regen2">重新生成</button>';
  const rg = $("ai-regen2");
  if (rg) rg.onclick = () => openAiDrawer(aiOpenIndex, true);
}

async function openAiDrawer(i, force) {
  const s = art().sentences[i];
  if (!s) return;
  aiOpenIndex = i;
  $("ai-sent").textContent = s.text;
  $("ai-drawer").classList.remove("hidden");
  $("ai-model").textContent = "";
  $("ai-body").innerHTML =
    '<div class="ai-loading">🤖 AI 正在拆解… 已用 <span id="ai-secs">0</span> 秒</div>';
  $("ai-foot").innerHTML = "<span>首次拆解需联网（约 5–15 秒），结果会永久缓存</span>";
  const t0 = Date.now();
  clearInterval(aiTimer);
  aiTimer = setInterval(() => {
    const el = $("ai-secs");
    if (el) el.textContent = Math.round((Date.now() - t0) / 1000);
  }, 500);
  let res;
  try {
    res = await fetchExplain(s.text, aiCtx(i), force);
  } catch (e) {
    res = { ok: false, error: "请求失败：" + e.message };
  }
  clearInterval(aiTimer);
  if (aiOpenIndex !== i) return;        // 期间跳走了，不覆盖
  renderExplain(res);
}

function closeAiDrawer() {
  aiOpenIndex = null;
  clearInterval(aiTimer);
  $("ai-drawer").classList.add("hidden");
}

function renderDef(defs, word) {
  $("lookup-ipa").textContent = "";
  let html = "";
  let firstDef = "";
  const seen = new Set();
  for (const d of defs.slice(0, 5)) {
    const parts = d.split("\t");
    const pos = (parts[0] || "").trim();
    const def = (parts[1] || "").trim();
    if (!def || seen.has(pos + def)) continue;
    seen.add(pos + def);
    if (!firstDef) firstDef = def;
    html += `<div class="lookup-pos">${POS[pos] || ""}</div><div class="lookup-def">${esc(def)}</div>`;
  }
  $("lookup-body").innerHTML = html || '<div class="lookup-loading">😕 未找到释义</div>';
  $("lookup-speak").onclick = () => speakWord(word);
  if (lastLookup) { lastLookup.en = firstDef; updateSaveBtn(); }
}

async function lookupWord(word, anchor) {
  document.querySelectorAll(".w.active-lookup").forEach(el => el.classList.remove("active-lookup"));
  if (anchor) anchor.classList.add("active-lookup");
  $("lookup").classList.remove("hidden");
  $("lookup-word").textContent = word;
  $("lookup-ipa").textContent = "";
  $("lookup-zh").classList.add("hidden");
  lastLookup = { word: word, zh: "", en: "" };
  updateSaveBtn();
  $("lookup-body").innerHTML = '<div class="lookup-loading">🔍 查询中…</div>';
  try {
    const { defs, word: found } = await fetchDefinitions(word);
    renderDef(defs, found);
  } catch (e) {
    $("lookup-body").innerHTML = '<div class="lookup-loading">😕 未找到释义（可试试单词原形，或检查网络）</div>';
  }
  const zh = await fetchZh(word);
  if (zh) {
    $("lookup-zh").textContent = "中：" + zh;
    $("lookup-zh").classList.remove("hidden");
    if (lastLookup) lastLookup.zh = zh;
  }
  updateSaveBtn();
}

// ---- 就绪状态（仅服务模式有 /status；静态模式自动忽略）----
let lastStatus = null;
function applyStatus(st) {
  lastStatus = st;
  const badge = $("ready");
  if (badge) badge.textContent = st.done ? `✓ 就绪 ${st.total}` : `⏳ 生成中 ${st.ready}/${st.total}`;
  const art2 = st.articles && st.articles[a];
  if (art2 && art2.mask) {
    document.querySelectorAll("#sents .sent").forEach((row, i) => {
      row.classList.toggle("notready", art2.mask[i] === "0");
    });
  }
}
function pollStatus() {
  fetch(`/status?issue=${encodeURIComponent(curIssue || "")}`, { cache: "no-store" })
    .then(r => { if (!r.ok) throw new Error("no status"); return r.json(); })
    .then(st => { applyStatus(st); if (!st.done) setTimeout(pollStatus, 2000); })
    .catch(() => {});
}

// ---- 期号切换（多期模式；每期正文按需加载）----
function initIssues() {
  const sel = $("issue");
  if (!ISSUES || ISSUES.length <= 1) return;   // 单期/单文件：不显示下拉
  sel.innerHTML = ISSUES.map(i =>
    `<option value="${esc(i.id)}">${esc(i.label)} · ${i.count} 篇</option>`).join("");
  sel.value = curIssue;
  sel.classList.remove("hidden");
  sel.addEventListener("change", () => switchIssue(sel.value));
}

async function switchIssue(iid) {
  if (!iid || iid === curIssue) return;
  let data = issueCache[iid];
  const sel = $("issue");
  if (!data) {
    sel.disabled = true;
    $("pl-count").textContent = "加载中…";
    try {
      const r = await fetch(`/issue/${encodeURIComponent(iid)}`, { cache: "no-store" });
      if (!r.ok) throw new Error("HTTP " + r.status);
      data = await r.json();
      issueCache[iid] = data;
    } catch (e) {
      alert("加载该期失败：" + e.message);
      sel.value = curIssue;
      return;
    } finally {
      sel.disabled = false;
    }
  }
  audio.pause(); playing = false; renderPlay();
  curIssue = iid;
  ARTICLES = data;
  indexArticles();
  a = 0; idx = 0; lastStatus = null;
  renderPlaylist();
  renderArticle();
  setActive(0);
  pollStatus();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

// ---- 生词本（服务模式存文件；静态模式存浏览器 localStorage）----
const VN_KEY = "echo_vocab";
let vocabBook = [];
let vocabServer = false;
let lastLookup = null;

async function vnLoad() {
  try {
    const r = await fetch("/vocab", { cache: "no-store" });
    if (r.ok) { vocabBook = (await r.json()).items || []; vocabServer = true; return; }
  } catch (e) { /* 静态模式，改用 localStorage */ }
  try { vocabBook = JSON.parse(localStorage.getItem(VN_KEY) || "[]") || []; } catch (e) { vocabBook = []; }
}

function vnSaveLocal() {
  try { localStorage.setItem(VN_KEY, JSON.stringify(vocabBook)); } catch (e) {}
}

async function vnPost(path, body) {
  const r = await fetch(path, {
    method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body || {}),
  });
  if (r.ok) vocabBook = (await r.json()).items || vocabBook;
}

function vnHas(word) {
  return vocabBook.some(x => (x.word || "").toLowerCase() === String(word).toLowerCase());
}

async function vnAdd(entry) {
  vocabBook = [entry].concat(vocabBook.filter(x => (x.word || "").toLowerCase() !== entry.word.toLowerCase()));
  if (vocabServer) { try { await vnPost("/vocab/add", entry); } catch (e) {} } else { vnSaveLocal(); }
  renderVocabBook();
}

async function vnRemove(word) {
  vocabBook = vocabBook.filter(x => (x.word || "").toLowerCase() !== String(word).toLowerCase());
  if (vocabServer) { try { await vnPost("/vocab/remove", { word }); } catch (e) {} } else { vnSaveLocal(); }
  renderVocabBook();
}

async function vnClear() {
  vocabBook = [];
  if (vocabServer) { try { await vnPost("/vocab/clear", {}); } catch (e) {} } else { vnSaveLocal(); }
  renderVocabBook();
}

function updateSaveBtn() {
  const btn = $("lookup-save");
  if (!btn || !lastLookup) return;
  const has = vnHas(lastLookup.word);
  btn.textContent = has ? "★ 已加入" : "☆ 生词本";
  btn.classList.toggle("toggle-on", has);
}

function renderVocabBook() {
  const n = vocabBook.length;
  const cnt = $("vn-count");
  if (cnt) cnt.textContent = n ? ` ${n}` : "";
  const total = $("vn-total");
  if (total) total.textContent = n ? `${n} 个` : "";
  const box = $("vn-list");
  if (box) {
    box.innerHTML = n ? vocabBook.map((x, k) => `
      <div class="vn-item">
        <div class="vn-line">
          <span class="vn-word">${esc(x.word)}</span>
          ${x.zh ? `<span class="vn-zh">${esc(x.zh)}</span>` : ""}
          <button class="vn-btn" data-act="speak" data-k="${k}" title="朗读">🔊</button>
          <button class="vn-btn" data-act="jump" data-k="${k}" title="跳回原句">↪</button>
          <button class="vn-btn" data-act="del" data-k="${k}" title="删除">🗑</button>
        </div>
        ${x.en ? `<div class="vn-en">${esc(x.en)}</div>` : ""}
        ${x.note ? `<div class="vn-note">…${esc(x.note)}</div>` : ""}
      </div>`).join("") : '<div class="vn-empty">生词本还是空的。<br>查词时点「☆ 生词本」即可加入。</div>';
  }
  updateSaveBtn();
}

function vnExport() {
  const el = document.createElement("a");
  el.href = URL.createObjectURL(new Blob([JSON.stringify(vocabBook, null, 2)], { type: "application/json" }));
  el.download = "生词本.json";
  el.click();
  URL.revokeObjectURL(el.href);
}

function currentCtx() {
  const s = art().sentences[idx];
  return { note: s ? s.text : "", src: art().label, a: a, i: idx };
}

function vnJump(x) {
  if (typeof x.a === "number" && ARTICLES[x.a] && typeof x.i === "number" && ARTICLES[x.a].sentences[x.i]) {
    playArticle(x.a, x.i);
  }
}

// ---- 学习进度：把文章标记为「已完成」----
const PG_KEY = "echo_progress";
let progress = {};
let pgServer = false;

async function pgLoad() {
  try {
    const r = await fetch("/progress", { cache: "no-store" });
    if (r.ok) { progress = (await r.json()).completed || {}; pgServer = true; return; }
  } catch (e) { /* 静态模式，改用 localStorage */ }
  try { progress = JSON.parse(localStorage.getItem(PG_KEY) || "{}") || {}; } catch (e) { progress = {}; }
}

function pgSaveLocal() {
  try { localStorage.setItem(PG_KEY, JSON.stringify(progress)); } catch (e) {}
}

async function pgSet(id, done) {
  if (done) progress[id] = new Date().toISOString().slice(0, 19);
  else delete progress[id];
  if (pgServer) {
    try {
      const r = await fetch("/progress/mark", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ id: id, done: done }),
      });
      if (r.ok) progress = (await r.json()).completed || progress;
    } catch (e) {}
  } else {
    pgSaveLocal();
  }
}

function pgDone(k) { return !!progress[ARTICLES[k].id]; }
function pgDoneCount() { return ARTICLES.filter(ar => progress[ar.id]).length; }

function updateMarkBtn() {
  const btn = $("mark-done");
  if (!btn) return;
  const done = !!progress[ARTICLES[a].id];
  btn.textContent = done ? "✓ 已完成（点击取消）" : "✓ 标记完成";
  btn.classList.toggle("done", done);
}

// ---- 设置页（仅服务模式可用）----
let settings = null;

async function setLoad() {
  try {
    const r = await fetch("/settings", { cache: "no-store" });
    if (!r.ok) throw new Error("no settings");
    settings = await r.json();
    return true;
  } catch (e) { return false; }
}

async function setPost(path, body) {
  try {
    const r = await fetch(path, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body || {}),
    });
    return r.ok ? await r.json() : { ok: false, error: "请求失败" };
  } catch (e) { return { ok: false, error: String(e) }; }
}

function renderSettings() {
  if (!settings) return;
  const dirs = settings.search_dirs || [];
  const dirRows = dirs.length
    ? dirs.map((d, i) => `
        <div class="set-item">
          <span class="set-badge">${i === 0 ? "默认" : i + 1}</span>
          <span class="set-path" title="${esc(d)}">${esc(d)}</span>
          <button class="vn-btn" data-reveal="${esc(d)}" title="在 Finder 中显示">📂</button>
          <button class="vn-btn" data-rmdir="${esc(d)}" title="移除">🗑</button>
        </div>`).join("")
    : '<div class="set-empty">还没有添加搜索路径</div>';

  const infoRow = (label, p) => `
    <div class="set-row">
      <span class="set-label">${esc(label)}</span>
      <span class="set-path" title="${esc(p)}">${esc(p)}</span>
      <button class="vn-btn" data-reveal="${esc(p)}" title="在 Finder 中显示">📂</button>
    </div>`;

  $("set-body").innerHTML = `
    <div class="set-section">
      <div class="set-title">搜索路径 <span class="hint">（扫描 md 的目录，第一个为默认）</span></div>
      <div class="set-list">${dirRows}</div>
      <div class="set-add">
        <input id="set-newdir" type="text" placeholder="输入目录绝对路径，如 /Volumes/磁盘/英语学习" />
        <button id="set-addbtn">添加</button>
      </div>
      <div class="set-note">新增的路径会置顶为主路径；修改后需<b>重启 Echo</b> 才会重新扫描文章。</div>
    </div>
    <div class="set-section">
      <div class="set-title">数据与产物路径</div>
      ${infoRow("数据目录", settings.data_dir)}
      ${infoRow("生词本", settings.vocab_file)}
      ${infoRow("学习进度", settings.progress_file)}
      ${infoRow("句子中译缓存（" + (settings.translated_count || 0) + " 句）", settings.translations_file)}
      ${infoRow("产物目录", settings.dist_dir)}
      ${infoRow("项目根目录", settings.project_root)}
      <div class="set-add">
        <button id="set-datadir">更改数据目录…</button>
        <button id="set-datadir-reset">恢复默认</button>
      </div>
      <div class="set-note">数据目录决定 config / 生词本 / 学习进度 的存放位置，修改后<b>立即生效</b>。</div>
    </div>
    <div class="set-section">
      <div class="set-title">📚 资料库 <span class="hint">（EPUB 转换产物，由 tools/epub2md.py 生成）</span></div>
      ${settings.md_root ? infoRow("md 资料库", settings.md_root) : ""}
      ${settings.print_root ? infoRow("打印版目录", settings.print_root) : ""}
      <div class="set-add">
        <button id="set-usemd">把 md 资料库设为搜索路径</button>
      </div>
      <div class="set-note">库内现有 <b>${settings.md_issues || 0} 期</b>；设为搜索路径后重启 Echo，
        即可按「期号 → 文章」两级浏览（顶栏出现期号下拉）。</div>
    </div>
    <div class="set-section">
      <div class="set-title">🤖 AI 拆解 <span class="hint">（点句子右侧「析」让 AI 精讲）</span></div>
      <div class="set-row">
        <span class="set-label">厂商</span>
        <select id="set-ai-provider">
          ${(settings.ai_providers || []).map(p =>
            `<option value="${esc(p.id)}"${p.id === settings.ai_provider ? " selected" : ""}>${esc(p.name)}</option>`).join("")}
        </select>
      </div>
      <div class="set-row">
        <span class="set-label">接口地址</span>
        <input id="set-ai-base" type="text" placeholder="https://api.deepseek.com/v1" value="${esc(settings.ai_base_url || "")}" />
      </div>
      <div class="set-row">
        <span class="set-label">模型</span>
        <input id="set-ai-model" type="text" placeholder="deepseek-chat" value="${esc(settings.ai_model || "")}" />
      </div>
      <div class="set-row">
        <span class="set-label">API Key</span>
        <input id="set-ai-key" type="password" placeholder="${settings.ai_key_masked ? esc(settings.ai_key_masked) + "（留空=不修改）" : "尚未填写"}" />
      </div>
      <div class="set-add">
        <button id="set-ai-save">保存</button>
        <button id="set-ai-test">测试连接</button>
        <button id="set-ai-clear">清空拆解缓存</button>
      </div>
      <div class="set-note" id="set-ai-note">
        ${settings.ai_configured ? "✅ 已配置" : "⚠️ 尚未配置完整（接口地址 + 模型 + Key）"}
        · 拆解缓存 <b>${settings.explain_count || 0}</b> 条
        <span class="set-path">${esc(settings.explains_file || "")}</span>
        <br>Key 只存在本机 <code>data/config.json</code>，不会上传到任何服务器；
        AI 拆解按句按需调用，同一句只请求一次。
      </div>
    </div>`;
}

async function reloadUserData() {
  await Promise.all([vnLoad(), pgLoad()]);
  renderVocabBook();
  renderPlaylist();
  updateMarkBtn();
}

async function openSettings() {
  $("set-modal").classList.remove("hidden");
  if (!settings) {
    $("set-body").innerHTML = '<div class="set-empty">加载中…</div>';
    if (!(await setLoad())) {
      $("set-body").innerHTML =
        '<div class="set-empty">当前模式没有设置页（请用 launch.command 或 Echo.app 启动）</div>';
      return;
    }
  }
  renderSettings();
}

// ---- 渲染 ----
function renderPlaylist() {
  $("pl-list").innerHTML = ARTICLES.map((ar, k) => {
    const done = !!progress[ar.id];
    return `<div class="pl-item${done ? " done" : ""}" data-a="${k}">
       <span class="pl-idx">${done ? "✓" : (k + 1)}</span>
       <span class="pl-label">${esc(ar.label)}</span>
       <span class="pl-n">${ar.sentences.length}句</span>
     </div>`;
  }).join("");
  $("pl-count").textContent = `${ARTICLES.length} 篇 · 已完成 ${pgDoneCount()}`;
}

function renderArticle() {
  $("sents").innerHTML = art().sentences.map((s, i) =>
    `<div class="sent" data-i="${i}"><span class="idx">${i + 1}</span><span class="txt">${wrapWords(s.text)}</span><button class="zh-btn" data-zh="${i}" title="显示中文翻译">译</button><button class="zh-btn ai-btn" data-ai="${i}" title="AI 拆解这句">析</button></div>`).join("");
  $("vocab").innerHTML = (art().vocab || []).map(v =>
    `<div class="vocab-item" data-w="${esc(v.word)}">
       <div class="vw-line"><span class="vw-word">${esc(v.word)}</span><span class="vw-ipa">${esc(v.phonetic)}</span><span class="speaker">🔊</span></div>
       <div class="vw-mean">${esc(v.meaning)}</div>
       <div class="vw-ex">${esc(v.example)}</div>
     </div>`).join("");
  document.querySelectorAll(".pl-item").forEach((el, k) => el.classList.toggle("active", k === a));
  $("focus-label").textContent = `${art().label} · 正在朗读 · 点击可重播`;
  $("sents-head").textContent = `${art().label} · 逐句 · 点击跳转`;
  updateMarkBtn();
  if (lastStatus) applyStatus(lastStatus);
}

function globalIndex() {
  let g = 0;
  for (let k = 0; k < a; k++) g += ARTICLES[k].sentences.length;
  return g + idx;
}

function setActive(i) {
  idx = i;
  focusZhOn = false;                     // 换句后收起上一句的译文
  $("focus-zh").className = "focus-zh hidden";
  $("zh-toggle").classList.remove("on");
  if (aiOpenIndex !== null && aiOpenIndex !== i) {
    // 抽屉开着但换了句：不自动拆解（避免消耗额度），只给一个按钮
    aiOpenIndex = null;
    clearInterval(aiTimer);
    $("ai-body").innerHTML =
      `<div class="ai-empty">已切到第 ${i + 1} 句（未自动拆解，避免消耗额度）</div>`;
    $("ai-foot").innerHTML = `<button id="ai-now">拆解第 ${i + 1} 句</button>`;
    const b = $("ai-now");
    if (b) b.onclick = () => openAiDrawer(idx);
  }
  document.querySelectorAll(".sent").forEach((el, k) => el.classList.toggle("active", k === i));
  const cur = document.querySelector(".sent.active");
  if (cur) cur.scrollIntoView({ block: "nearest", behavior: "smooth" });
  $("focus-text").innerHTML = wrapWords(art().sentences[i].text);
  $("focus-meta").textContent = `第 ${i + 1} / ${art().sentences.length} 句`;
  $("counter").textContent = `文章 ${a + 1}/${ARTICLES.length} · 句 ${i + 1}/${art().sentences.length}`;
  $("progress").style.width = `${((globalIndex() + 1) / totalSentences) * 100}%`;
  $("focus-text").onclick = e => {
    const w = e.target.closest(".w");
    if (w) lookupWord(w.dataset.w, w);
    else play(i);
  };
}

function play(i) {
  if (i !== undefined) idx = i;
  audio.src = art().sentences[idx].audio;
  audio.playbackRate = parseFloat($("speed").value);
  audio.play().then(() => { playing = true; renderPlay(); }).catch(() => {});
  setActive(idx);
}

function playArticle(ai, si) {
  if (ai < 0 || ai >= ARTICLES.length) return;
  a = ai;
  renderArticle();
  play(si !== undefined ? si : 0);
}

function lastSentence() { return idx >= art().sentences.length - 1; }
function lastArticle() { return a >= ARTICLES.length - 1; }

// 手动「下一句」：尽量往后走，到头后按循环模式处理
function nextSentence() {
  if (!lastSentence()) { play(idx + 1); return; }
  if (!lastArticle()) { playArticle(a + 1, 0); return; }
  if (loopMode === "list") { playArticle(0, 0); return; }   // 列表循环 → 回到第一篇
  if (loopMode === "track") { play(0); return; }            // 单篇循环 → 本篇重头
  audio.pause(); playing = false; renderPlay();
}

function prevSentence() {
  if (idx > 0) { play(idx - 1); return; }
  if (a > 0) { playArticle(a - 1, ARTICLES[a - 1].sentences.length - 1); return; }
  if (loopMode !== "off") {
    const lastA = ARTICLES.length - 1;
    playArticle(lastA, ARTICLES[lastA].sentences.length - 1);
    return;
  }
  play(0);
}

function pause() { audio.pause(); playing = false; renderPlay(); }
function togglePlay() { playing ? pause() : play(idx); }
function renderPlay() { $("play").textContent = playing ? "⏸" : "▶"; }

audio.addEventListener("ended", () => {
  if (repeatMode) { audio.currentTime = 0; audio.play(); return; }   // 单句循环
  if (!autoMode) { playing = false; renderPlay(); return; }          // 未开连播
  if (!lastSentence()) { play(idx + 1); return; }                    // 本篇下一句
  // 本篇播完
  if (loopMode === "track") { play(0); return; }                     // 单篇循环
  if (!lastArticle()) { playArticle(a + 1, 0); return; }             // 还有下一篇
  if (loopMode === "list") { playArticle(0, 0); return; }            // 列表循环
  playing = false; renderPlay();
});

// ---- 事件 ----
$("pl-list").addEventListener("click", e => {
  const item = e.target.closest(".pl-item");
  if (item) playArticle(parseInt(item.dataset.a, 10), 0);
});

$("sents").addEventListener("click", e => {
  const ab = e.target.closest(".ai-btn");
  if (ab) { openAiDrawer(parseInt(ab.dataset.ai, 10)); return; }
  const zb = e.target.closest(".zh-btn[data-zh]");
  if (zb) { toggleSentenceZh(zb, art().sentences[parseInt(zb.dataset.zh, 10)].text); return; }
  const w = e.target.closest(".w");
  if (w) { lookupWord(w.dataset.w, w); return; }
  const row = e.target.closest(".sent");
  if (row) play(parseInt(row.dataset.i, 10));
});

$("vocab").addEventListener("click", e => {
  const item = e.target.closest(".vocab-item");
  if (item) { speakWord(item.dataset.w); lookupWord(item.dataset.w, item); }
});

$("play").addEventListener("click", togglePlay);
$("prev").addEventListener("click", prevSentence);
$("next").addEventListener("click", nextSentence);
$("speed").addEventListener("change", () => { audio.playbackRate = parseFloat($("speed").value); });
$("loop").addEventListener("change", () => { loopMode = $("loop").value; });
$("repeat").addEventListener("click", () => {
  repeatMode = !repeatMode;
  $("repeat").classList.toggle("toggle-on", repeatMode);
});
$("auto").addEventListener("click", () => {
  autoMode = !autoMode;
  $("auto").classList.toggle("toggle-on", autoMode);
});

$("lookup-close").addEventListener("click", () => $("lookup").classList.add("hidden"));
document.addEventListener("click", e => {
  const card = $("lookup");
  if (card.classList.contains("hidden")) return;
  if (card.contains(e.target)) return;
  if (e.target.closest(".w, .vocab-item")) return;
  card.classList.add("hidden");
});

document.addEventListener("keydown", e => {
  for (const id of ["vn-modal", "set-modal"]) {
    const modal = $(id);
    if (modal && !modal.classList.contains("hidden")) {
      if (e.key === "Escape") modal.classList.add("hidden");
      return;
    }
  }
  if (e.target.tagName === "SELECT" || e.target.tagName === "INPUT") return;
  if (e.code === "Space") { e.preventDefault(); togglePlay(); }
  else if (e.key === "ArrowLeft") prevSentence();
  else if (e.key === "ArrowRight") nextSentence();
  else if (e.key === "t" || e.key === "T") toggleFocusZh(art().sentences[idx].text);
  else if (e.key === "e" || e.key === "E") openAiDrawer(idx);
  else if (e.key === "Escape") {
    $("lookup").classList.add("hidden");
    closeAiDrawer();
  }
});

// ---- 生词本事件 ----
$("vn-open").addEventListener("click", () => { renderVocabBook(); $("vn-modal").classList.remove("hidden"); });
$("vn-close").addEventListener("click", () => $("vn-modal").classList.add("hidden"));
$("vn-modal").addEventListener("click", e => { if (e.target.id === "vn-modal") $("vn-modal").classList.add("hidden"); });
$("vn-export").addEventListener("click", vnExport);
$("vn-clear").addEventListener("click", () => { if (confirm("确定清空生词本？")) vnClear(); });
$("vn-list").addEventListener("click", e => {
  const b = e.target.closest(".vn-btn");
  if (!b) return;
  const item = vocabBook[parseInt(b.dataset.k, 10)];
  if (!item) return;
  if (b.dataset.act === "speak") speakWord(item.word);
  else if (b.dataset.act === "del") vnRemove(item.word);
  else if (b.dataset.act === "jump") { $("vn-modal").classList.add("hidden"); vnJump(item); }
});
$("lookup-save").addEventListener("click", () => {
  if (!lastLookup) return;
  if (vnHas(lastLookup.word)) {
    vnRemove(lastLookup.word);
  } else {
    const c = currentCtx();
    vnAdd({ word: lastLookup.word, zh: lastLookup.zh || "", en: lastLookup.en || "",
            note: c.note, src: c.src, a: c.a, i: c.i });
  }
});

// ---- 句中译事件 ----
$("zh-toggle").addEventListener("click", () =>
  toggleFocusZh(art().sentences[idx].text));

// ---- AI 拆解事件 ----
$("ai-open").addEventListener("click", () => openAiDrawer(idx));
// 设置页：换厂商时自动填接口地址与推荐模型
$("set-body").addEventListener("change", e => {
  if (e.target.id !== "set-ai-provider") return;
  const p = ((settings && settings.ai_providers) || []).find(x => x.id === e.target.value);
  if (!p) return;
  $("set-ai-base").value = p.base_url;
  $("set-ai-model").value = p.model;
});
$("ai-close").addEventListener("click", closeAiDrawer);
$("ai-regen").addEventListener("click", () => {
  if (aiOpenIndex !== null) openAiDrawer(aiOpenIndex, true);
});
$("ai-sent").addEventListener("click", () => {
  if (aiOpenIndex !== null) play(aiOpenIndex);
});

// ---- 学习进度事件 ----
$("mark-done").addEventListener("click", async () => {
  const id = ARTICLES[a].id;
  await pgSet(id, !progress[id]);
  renderPlaylist();
  renderArticle();
  setActive(idx);
});

// ---- 设置事件 ----
$("set-open").addEventListener("click", openSettings);
$("set-close").addEventListener("click", () => $("set-modal").classList.add("hidden"));
$("set-modal").addEventListener("click", e => {
  if (e.target.id === "set-modal") $("set-modal").classList.add("hidden");
});
$("set-body").addEventListener("click", async e => {
  const rev = e.target.closest("[data-reveal]");
  if (rev) {
    const r = await setPost("/settings/reveal", { path: rev.dataset.reveal });
    if (!r.ok) alert("无法打开：" + (r.error || ""));
    return;
  }
  const rm = e.target.closest("[data-rmdir]");
  if (rm) {
    await setPost("/settings/remove_search_dir", { dir: rm.dataset.rmdir });
    await setLoad();
    renderSettings();
    return;
  }
  if (e.target.id === "set-addbtn") {
    const v = ($("set-newdir").value || "").trim();
    if (!v) return;
    const r = await setPost("/settings/add_search_dir", { dir: v });
    if (!r.ok) { alert("添加失败：" + (r.error || "")); return; }
    $("set-newdir").value = "";
    await setLoad();
    renderSettings();
    return;
  }
  if (e.target.id === "set-usemd") {
    if (!settings || !settings.md_root) return;
    const r = await setPost("/settings/add_search_dir", { dir: settings.md_root });
    if (!r.ok) { alert("添加失败：" + (r.error || "")); return; }
    await setLoad();
    renderSettings();
    alert("已设为默认搜索路径，重启 Echo 生效。");
    return;
  }
  if (e.target.id === "set-ai-save") {
    const r = await setPost("/ai/settings", {
      provider: $("set-ai-provider").value,
      base_url: $("set-ai-base").value.trim(),
      model: $("set-ai-model").value.trim(),
      api_key: $("set-ai-key").value.trim(),   // 空 = 不修改
    });
    if (!r.ok) { alert("保存失败：" + (r.error || "")); return; }
    $("set-ai-key").value = "";
    await setLoad();
    renderSettings();
    alert(r.configured ? "已保存。建议点「测试连接」验证一下。" : "已保存，但配置还不完整（地址 + 模型 + Key）。");
    return;
  }
  if (e.target.id === "set-ai-test") {
    const btn = e.target;
    const old = btn.textContent;
    btn.disabled = true;
    btn.textContent = "测试中…";
    const r = await setPost("/ai/test", {});
    btn.disabled = false;
    btn.textContent = old;
    $("set-ai-note").innerHTML = r.ok
      ? `✅ 连接正常 · 模型 <b>${esc(r.model)}</b> · ${r.ms} ms · 回执「${esc(r.reply || "")}」`
      : `❌ ${esc(r.error || "测试失败")}`;
    return;
  }
  if (e.target.id === "set-ai-clear") {
    if (!confirm("确定清空 AI 拆解缓存？下次需重新生成（会消耗额度）。")) return;
    await setPost("/ai/clear_cache", {});
    await setLoad();
    renderSettings();
    return;
  }
  if (e.target.id === "set-datadir" || e.target.id === "set-datadir-reset") {
    const reset = e.target.id === "set-datadir-reset";
    let v = "";
    if (!reset) {
      v = prompt("输入新的数据目录绝对路径（留空则恢复默认）：", settings ? settings.data_dir : "");
      if (v === null) return;
    }
    const r = await setPost("/settings/data_dir", { dir: v });
    if (!r.ok) { alert("设置失败：" + (r.error || "")); return; }
    await setLoad();
    renderSettings();
    await reloadUserData();
    return;
  }
});

renderPlaylist();
renderArticle();
setActive(0);
initIssues();
pollStatus();
Promise.all([vnLoad(), pgLoad()]).then(() => {
  renderVocabBook();
  renderPlaylist();
  updateMarkBtn();
});
setLoad().then(ok => { if (!ok) $("set-open").style.display = "none"; });
</script>
</body>
</html>
